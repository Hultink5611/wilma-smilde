name: Deploy naar GitHub Pages

# GitHub Pages staat op branch-deploy vanaf gh-pages; deze workflow
# spiegelt main naar gh-pages zodat elke merge automatisch live gaat.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push --force origin HEAD:gh-pages
