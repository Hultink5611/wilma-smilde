name: Deploy naar GitHub Pages

# Publiceert de repo-root op GitHub Pages via branch-deploy vanaf gh-pages.
# De workflow spiegelt main naar gh-pages en zet Pages zo nodig zelf aan.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gh-pages bijwerken
        run: git push --force origin HEAD:gh-pages

      - name: Pages inschakelen als het uitstaat
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/pages" >/dev/null 2>&1; then
            echo "Pages staat al aan."
          elif gh api -X POST "repos/$REPO/pages" \
                 -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null 2>&1; then
            echo "Pages ingeschakeld op gh-pages / root."
          else
            echo "::warning::Pages kon niet automatisch worden ingeschakeld. Zet het aan via Settings -> Pages -> Deploy from a branch -> gh-pages / root. De gh-pages-branch is bijgewerkt, dus daarna staat de site meteen live."
          fi
